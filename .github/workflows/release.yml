name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run TUI smoke gate
        env:
          PAPERSILM_TUI_PTY_ARTIFACT_DIR: ${{ runner.temp }}/papersilm-tui-pty
          PAPERSILM_TUI_PROCESS_ARTIFACT_DIR: ${{ runner.temp }}/papersilm-tui-process
        run: bash scripts/tui-smoke.sh

      - name: Upload TUI smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tui-smoke-artifacts
          path: |
            ${{ runner.temp }}/papersilm-tui-pty
            ${{ runner.temp }}/papersilm-tui-process
          if-no-files-found: ignore

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
